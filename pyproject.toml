[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noteforge"
version = "3.0.0"
description = "Real-Time Transcription & Intelligent Note Summarization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter==5.2.2",
    "sounddevice==0.4.6",
    "numpy>=1.21.0,<2.0.0",
    "vosk==0.3.45",
    "openai-whisper==20231106",
    "Pillow==10.1.0",
    "torch==2.1.0",
    "transformers==4.35.2",
    "sentencepiece==0.1.99",
    "psutil==5.9.7",
    "tqdm==4.66.1",
    "requests==2.31.0",
    "python-pptx==0.6.23",
    "reportlab==4.0.7",
    "huggingface-hub==0.20.2",
    "nltk==3.8.1",
    "webrtcvad-wheels==2.0.10",
]

[project.scripts]
noteforge = "noteforge.main:main"

[tool.setuptools.packages.find]
where = ["src"]
